[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steve-muri-infergw_jd009"
version = "0.1.0"
description = "把候选项映射到类别上，算出推理网关架构师·梯度累积与有效批量的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "steve-muri" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://steve-muri.github.io"
Repository = "https://github.com/steve-muri/infergw_jd009"
Issues = "https://github.com/steve-muri/infergw_jd009/issues"

[project.scripts]
infergw_jd009 = "infergw_jd009:main"

[tool.setuptools]
py-modules = ["infergw_jd009"]
